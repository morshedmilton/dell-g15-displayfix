<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DisplayFix for Dell G15 5530">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76e0b8"/>
      <stop offset="100%" stop-color="#5aa9ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5aa9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1010" cy="70" r="220" fill="url(#glow)"/>
  <circle cx="180" cy="250" r="160" fill="url(#glow)" opacity="0.6"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="104" font-size="46" font-weight="700" fill="#eaf1ff">DisplayFix</text>
    <text x="70" y="146" font-size="21" fill="#9fb2d4">for Dell G15 5530 · Advanced Optimus / DDS</text>

    <rect x="70" y="176" width="330" height="3" rx="1.5" fill="url(#accent)"/>

    <text x="70" y="216" font-size="15" fill="#7f92b4">stale duplicate display path → cleared automatically</text>
    <text x="70" y="240" font-size="15" fill="#7f92b4">backlight stays controllable on either GPU</text>

    <g transform="translate(880,110)">
      <rect x="0" y="0" width="230" height="120" rx="14" fill="#0f1830" stroke="#22315a" stroke-width="1.5"/>
      <rect x="14" y="14" width="202" height="76" rx="7" fill="#16233f"/>
      <rect x="14" y="14" width="202" height="76" rx="7" fill="none" stroke="#2c4272" stroke-width="1.2"/>
      <circle cx="115" cy="52" r="17" fill="none" stroke="url(#accent)" stroke-width="3"/>
      <circle cx="115" cy="52" r="6" fill="url(#accent)"/>
      <rect x="90" y="100" width="50" height="6" rx="3" fill="#22315a"/>
      <text x="115" y="152" font-size="12" fill="#5f7295" text-anchor="middle" font-family="Consolas, monospace">dwm 1.4%</text>
    </g>
  </g>
</svg>
